name: Release

on:
  push:
    tags:
      # 仅当 git push 一个形如 1.0.0 的 tag 时触发
      # 匹配类似 1.0.0、2.3.4 这样的 tag
      - '[0-9]+.[0-9]+.[0-9]+'
  # 添加手动触发功能，允许在GitHub界面上点击运行
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., 3.2.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于生成 changelog

      # 🌐 使用 volta 安装 Node.js 并设置 pnpm
      # 🌐 设置 Node.js 和 pnpm
      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js with pnpm caching
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: elysiananime-ui/pnpm-lock.yaml

      - name: Install and Build Frontend
        run: |
          cd elysiananime-ui
          pnpm install --frozen-lockfile
          pnpm build
        shell: bash
        env:
          VITE_API_URL: "/api"  # 前端调用后端 API 的路径

      # ☕ 设置 Java 并构建后端
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend with Maven
        run: |
          cd elysiananime-server
          mvn -B package -DskipTests
        shell: bash

      # 📦 创建 release 目录并合并文件
      - name: Prepare Release Directory
        run: |
          mkdir -p ElysianAnime-Release/{backend,frontend}
          
          # 复制后端 jar
          cp elysiananime-server/elysiananime-api/target/*.jar ElysianAnime-Release/backend/
          cp elysiananime-server/elysiananime-api/target/classes/app.yml ElysianAnime-Release/backend/
          
          # 复制前端构建结果
          cp -r elysiananime-ui/dist/* ElysianAnime-Release/frontend/
          
          # 复制启动脚本
          cp doc/bin/start.bat ElysianAnime-Release/backend/
          cp doc/bin/stop.bat ElysianAnime-Release/backend/
          cp doc/bin/start.sh ElysianAnime-Release/backend/

          # 可选：复制 README 或说明文件
          cp README.md ElysianAnime-Release/ || echo "No README.md"
        shell: bash

      # 🗜️ 打包为 ZIP
      - name: Create ZIP Archive
        run: |
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          zip -r "ElysianAnime-$VERSION.zip" ElysianAnime-Release/
        shell: bash
        id: zip

      # 📜 生成 changelog
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # 🚀 创建 GitHub Release
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name || inputs.release_tag || github.ref_name }}
          bodyFile: CHANGELOG.md
          artifacts: "ElysianAnime-*.zip"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git checkout main
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          set +e
          git add CHANGELOG.md
          git commit -m "Update changelog"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git main
